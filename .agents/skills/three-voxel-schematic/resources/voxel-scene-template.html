<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel_Build_Template</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/src/web/assets/icon-32.png" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, sans-serif; }
    #hud {
      position: fixed; left: 14px; bottom: 14px; z-index: 10;
      background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 8px;
      color: #e2e8f0; padding: 8px 12px; font-size: 12px; pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">加载中...</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ==================== Reusable VoxelWorld Builder ====================
    class VoxelWorld {
      constructor(meta = {}) {
        this.name = meta.name || 'Voxel_Build';
        this.author = meta.author || 'AI_Architect';
        this.description = meta.description || '';
        this.cells = new Map();
      }

      _resolve(matOrFn, x, y, z) {
        return typeof matOrFn === 'function' ? matOrFn(x, y, z) : matOrFn;
      }

      set(x, y, z, mat) {
        if (!mat) return;
        const ix = Math.round(x), iy = Math.round(y), iz = Math.round(z);
        const entry = typeof mat === 'string' ? { color: mat } : mat;
        this.cells.set(`${ix},${iy},${iz}`, { x: ix, y: iy, z: iz, ...entry });
      }

      del(x, y, z) {
        this.cells.delete(`${Math.round(x)},${Math.round(y)},${Math.round(z)}`);
      }

      fillBox(x0, y0, z0, x1, y1, z1, matOrFn) {
        const [ax, bx] = [Math.min(x0, x1), Math.max(x0, x1)];
        const [ay, by] = [Math.min(y0, y1), Math.max(y0, y1)];
        const [az, bz] = [Math.min(z0, z1), Math.max(z0, z1)];
        for (let x = ax; x <= bx; x++) {
          for (let y = ay; y <= by; y++) {
            for (let z = az; z <= bz; z++) {
              this.set(x, y, z, this._resolve(matOrFn, x, y, z));
            }
          }
        }
      }

      hollowBox(x0, y0, z0, x1, y1, z1, matOrFn) {
        const [ax, bx] = [Math.min(x0, x1), Math.max(x0, x1)];
        const [ay, by] = [Math.min(y0, y1), Math.max(y0, y1)];
        const [az, bz] = [Math.min(z0, z1), Math.max(z0, z1)];
        for (let x = ax; x <= bx; x++) {
          for (let y = ay; y <= by; y++) {
            for (let z = az; z <= bz; z++) {
              if (x === ax || x === bx || y === ay || y === by || z === az || z === bz) {
                this.set(x, y, z, this._resolve(matOrFn, x, y, z));
              }
            }
          }
        }
      }

      cylinder(cx, y0, cz, radius, height, matOrFn, hollow = false) {
        const r2 = radius * radius;
        const innerR2 = Math.max(0, (radius - 1) * (radius - 1));
        for (let dy = 0; dy < height; dy++) {
          const y = y0 + dy;
          for (let dx = -Math.ceil(radius); dx <= Math.ceil(radius); dx++) {
            for (let dz = -Math.ceil(radius); dz <= Math.ceil(radius); dz++) {
              const d2 = dx * dx + dz * dz;
              if (d2 <= r2 && (!hollow || d2 >= innerR2)) {
                const x = cx + dx, z = cz + dz;
                this.set(x, y, z, this._resolve(matOrFn, x, y, z));
              }
            }
          }
        }
      }

      sphere(cx, cy, cz, radius, matOrFn, hollow = false) {
        const r2 = radius * radius;
        const innerR2 = Math.max(0, (radius - 1) * (radius - 1));
        const R = Math.ceil(radius);
        for (let dx = -R; dx <= R; dx++) {
          for (let dy = -R; dy <= R; dy++) {
            for (let dz = -R; dz <= R; dz++) {
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 <= r2 && (!hollow || d2 >= innerR2)) {
                const x = cx + dx, y = cy + dy, z = cz + dz;
                this.set(x, y, z, this._resolve(matOrFn, x, y, z));
              }
            }
          }
        }
      }

      line(x0, y0, z0, x1, y1, z1, mat) {
        const steps = Math.max(1, Math.hypot(x1 - x0, y1 - y0, z1 - z0) * 2);
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          this.set(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z0 + (z1 - z0) * t, mat);
        }
      }

      exportData() {
        return {
          name: this.name,
          author: this.author,
          description: this.description,
          voxels: Array.from(this.cells.values()),
        };
      }

      mountToScene(scene) {
        const unitGeo = new THREE.BoxGeometry(1, 1, 1);
        const groups = new Map();
        let minX = Infinity, minY = Infinity, minZ = Infinity;
        let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

        const isOccluding = (cell) =>
          Boolean(cell && (cell.opacity ?? 1) >= 0.95 && !cell.slab);

        for (const v of this.cells.values()) {
          if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
          if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
          if (v.z < minZ) minZ = v.z; if (v.z > maxZ) maxZ = v.z;

          if (
            isOccluding(v) &&
            isOccluding(this.cells.get(`${v.x + 1},${v.y},${v.z}`)) &&
            isOccluding(this.cells.get(`${v.x - 1},${v.y},${v.z}`)) &&
            isOccluding(this.cells.get(`${v.x},${v.y + 1},${v.z}`)) &&
            isOccluding(this.cells.get(`${v.x},${v.y - 1},${v.z}`)) &&
            isOccluding(this.cells.get(`${v.x},${v.y},${v.z + 1}`)) &&
            isOccluding(this.cells.get(`${v.x},${v.y},${v.z - 1}`))
          ) {
            continue;
          }

          const key = `${v.color}|${v.opacity ?? 1}|${v.emissive ?? ''}|${v.isLight ? 1 : 0}|${v.block ?? ''}`;
          if (!groups.has(key)) groups.set(key, { proto: v, items: [] });
          groups.get(key).items.push(v);
        }

        const root = new THREE.Group();
        const mat4 = new THREE.Matrix4();

        for (const { proto, items } of groups.values()) {
          const isGlass = (proto.opacity ?? 1) < 0.85;
          const isLight = Boolean(proto.isLight || proto.emissive);
          const material = new THREE.MeshStandardMaterial({
            color: new THREE.Color(proto.color || '#cccccc'),
            roughness: isGlass ? 0.15 : 0.82,
            metalness: 0.04,
            transparent: isGlass,
            opacity: proto.opacity ?? 1.0,
            emissive: isLight ? new THREE.Color(proto.emissive || proto.color) : new THREE.Color(0x000000),
            emissiveIntensity: isLight ? (proto.emissiveIntensity ?? 0.9) : 0,
          });
          if (proto.block) material.userData.block = proto.block;

          const inst = new THREE.InstancedMesh(unitGeo, material, items.length);
          inst.castShadow = !isGlass;
          inst.receiveShadow = true;
          items.forEach((v, i) => {
            mat4.makeTranslation(v.x + 0.5, v.y + 0.5, v.z + 0.5);
            inst.setMatrixAt(i, mat4);
          });
          inst.instanceMatrix.needsUpdate = true;
          root.add(inst);
        }

        scene.add(root);
        return {
          center: new THREE.Vector3((minX + maxX + 1) * 0.5, (minY + maxY + 1) * 0.45, (minZ + maxZ + 1) * 0.5),
          size: new THREE.Vector3(maxX - minX + 1, maxY - minY + 1, maxZ - minZ + 1),
        };
      }
    }

    // ==================== 1. Build Your Voxel Architecture Here ====================
    const world = new VoxelWorld({
      name: 'Sample_Shrine',
      description: 'Customize this section with your voxel build',
    });

    const MAT = {
      stone: { color: '#7a797a', block: 'minecraft:stone_bricks' },
      wood:  { color: '#725430', block: 'minecraft:spruce_planks' },
      light: { color: '#faf5ce', emissive: '#ffcc66', emissiveIntensity: 0.95, isLight: true, block: 'minecraft:ochre_froglight' },
    };

    world.fillBox(0, 0, 0, 10, 0, 10, MAT.stone);
    world.hollowBox(2, 1, 2, 8, 5, 8, MAT.wood);
    world.set(5, 3, 2, MAT.light);

    // Expose structured data for 1:1 lossless Litematica conversion!
    window.__VOXEL_DATA__ = world.exportData();

    // ==================== 2. Three.js Interactive Viewport ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0f172a');

    const { center, size } = world.mountToScene(scene);
    const maxDim = Math.max(size.x, size.y, size.z, 12);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(center.x + maxDim * 1.25, center.y + maxDim * 0.95, center.z + maxDim * 1.25);

    const useRealtimeShadows = world.cells.size <= 6000;
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = useRealtimeShadows;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(center);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xdbeafe, 0x334155, 0.82));
    const sun = new THREE.DirectionalLight(0xfff7ed, 1.35);
    sun.position.set(center.x + maxDim, center.y + maxDim * 1.6, center.z + maxDim * 0.8);
    sun.castShadow = useRealtimeShadows;
    scene.add(sun);

    document.getElementById('hud').textContent =
      `${world.name} · ${size.x}×${size.y}×${size.z} · ${world.cells.size} 方块`;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
