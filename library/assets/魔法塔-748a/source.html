      const tileTex = createVoxelTileTexture();
      const materials = [
        new THREE.MeshStandardMaterial({
          map: tileTex,
          vertexColors: true,
          roughness: 0.72,
          metalness: 0.06,
        }),
        new THREE.MeshBasicMaterial({
          map: tileTex,
          vertexColors: true,
          color: new THREE.Color(1.45, 1.25, 1.55), // 触发 Bloom 紫红奥术光
        }),
        new THREE.MeshBasicMaterial({
          map: tileTex,
          vertexColors: true,
          color: new THREE.Color(1.15, 1.38, 1.55), // 触发 Bloom 发光水渠/蓝法阵
        }),
        new THREE.MeshBasicMaterial({
          map: tileTex,
          vertexColors: true,
          color: new THREE.Color(1.55, 1.38, 0.95), // 触发 Bloom 金色法阵/星芒
        }),
      ];

      // 异步分步构筑，避免首帧卡死加载动画
      await new Promise(r => setTimeout(r, 30));
      statusEl.textContent = '构筑八角星芒巨型基座、下沉蓝金法阵与中心主塔...';
      await new Promise(r => setTimeout(r, 20));

      const mainGrid = new VoxelGrid(GX, GY, GZ, -CX, 0, -CZ);
      buildFoundation(mainGrid);
      buildMainTower(mainGrid);

      statusEl.textContent = '构筑四座异形卫戍副塔、飞扶壁与高架空中拱桥...';
      await new Promise(r => setTimeout(r, 20));

      buildNorthObservatory(mainGrid);
      buildEastAcademy(mainGrid);
      buildWestCrystalTower(mainGrid);
      buildSouthGatehouse(mainGrid);
      buildMainSideConnections(mainGrid);
      buildOuterColonnadesAndPavilions(mainGrid);

      statusEl.textContent = '执行隐藏面剔除与 Minecraft 环境光遮蔽烘焙...';
      await new Promise(r => setTimeout(r, 20));

      const castleGroup = new THREE.Group();
      const mainGeos = mainGrid.buildGeometries();
      let totalTris = 0;
      let totalVoxels = mainGrid.voxelCount;

      mainGeos.forEach((geo, idx) => {
        if (!geo) return;
        const mesh = new THREE.Mesh(geo, materials[idx]);
        mesh.castShadow = (idx === 0);
        mesh.receiveShadow = (idx === 0);
        castleGroup.add(mesh);
        totalTris += geo.index.count / 3;
      });
      scene.add(castleGroup);

      // 独立动态体素构件：主塔三道巨大倾斜交错白石环
      const ringsAnchor = new THREE.Group();
      ringsAnchor.position.set(0, 114, 0);
      scene.add(ringsAnchor);

      const ringConfigs = [
        { r: 28, hw: 1.8, hh: 1.5, rot: [0.46, 0.10, 0.28], speed:  0.11 },
        { r: 33, hw: 2.0, hh: 1.5, rot: [-0.40, 0.78, -0.35], speed: -0.08 },
        { r: 23, hw: 1.5, hh: 1.2, rot: [0.28, -0.95, -0.52], speed:  0.15 },
      ];
      const rotatingRings = [];
      for (const cfg of ringConfigs) {
        const res = buildVoxelRingMesh(cfg.r, cfg.hw, cfg.hh, materials, 'whiteStone');
        const pivot = new THREE.Group();
        pivot.rotation.set(cfg.rot[0], cfg.rot[1], cfg.rot[2]);
        pivot.add(res.group);
        ringsAnchor.add(pivot);
        rotatingRings.push({ mesh: res.group, speed: cfg.speed });
        totalVoxels += res.voxels;
        totalTris += res.tris;
      }

      // 主塔王冠悬浮发光紫水晶
      const crystalRes = buildVoxelCrystal(materials);
      const crystalPivot = new THREE.Group();
      crystalPivot.position.set(0, 157, 0);
      crystalPivot.add(crystalRes.group);
      scene.add(crystalPivot);
      totalVoxels += crystalRes.voxels;
      totalTris += crystalRes.tris;

      // 北方观星副塔顶部倾斜黄金星环
      const northRingRes = buildVoxelRingMesh(13.8, 1.2, 1.0, materials, 'goldStar');
      const northRingPivot = new THREE.Group();
      northRingPivot.position.set(0, 100, -50);
      northRingPivot.rotation.set(0.42, 0.2, -0.32);
      northRingPivot.add(northRingRes.group);
      scene.add(northRingPivot);
      totalVoxels += northRingRes.voxels;
      totalTris += northRingRes.tris;

      // 四座副塔顶端射入巨型倾斜白石环的紫色奥术能量光束
      const { pulses, outerMat: beamOuterMat } = createArcaneBeams(scene);
      const magicDust = createMagicDust(scene);

      // 更新统计显示
      document.getElementById('stat-voxels').textContent = `体素数: ${totalVoxels.toLocaleString()}`;
      document.getElementById('stat-tris').textContent = `三角面: ${Math.round(totalTris).toLocaleString()}`;

      // 隐藏加载幕布
      const loader = document.getElementById('loader');
      loader.classList.add('hidden');

      // =======================================================================
      // 9. 镜头预设、天光氛围切换与 HUD 交互
      // =======================================================================
      const CAM_PRESETS = {
        overview:  { pos: [145, 118, 178], target: [0, 56, 0] },
        southGate: { pos: [32, 48, 152],   target: [0, 54, 15] },
        mainTower: { pos: [56, 78, 72],    target: [0, 108, 0] },
        northObs:  { pos: [48, 118, -112], target: [0, 82, -46] },
        eastAcad:  { pos: [122, 92, 54],   target: [42, 66, 0] },
        westCore:  { pos: [-118, 92, 56],  target: [-42, 72, 0] },
      };

      let camAnim = null;
      function flyTo(key) {
        const p = CAM_PRESETS[key];
        if (!p) return;
        camAnim = {
          startPos: camera.position.clone(),
          endPos: new THREE.Vector3(...p.pos),
          startTgt: controls.target.clone(),
          endTgt: new THREE.Vector3(...p.target),
          t: 0,
        };
        document.querySelectorAll('[data-cam]').forEach(b => {
          b.classList.toggle('active', b.dataset.cam === key);
        });
      }

      const THEMES = {
        twilight: {
          top: '#0c1530', mid: '#1c2a54', horizon: '#3a3560', bottom: '#0c1124',
          fog: '#1c2748', fogDensity: 0.00145,
          hemiSky: '#c8dcff', hemiGnd: '#2c2947', hemiInt: 0.85,
          sunColor: '#fff4e0', sunInt: 1.65, sunPos: [135, 195, 115],
          rimInt: 0.55, exposure: 1.05, bloom: 0.52, ground: '#111b33',
        },
        day: {
          top: '#2466c4', mid: '#63a4e8', horizon: '#cfe6ff', bottom: '#50729e',
          fog: '#b9d8f7', fogDensity: 0.00105,
          hemiSky: '#ffffff', hemiGnd: '#7c8aa6', hemiInt: 1.05,
          sunColor: '#fffaf0', sunInt: 1.95, sunPos: [145, 220, 125],
          rimInt: 0.35, exposure: 0.98, bloom: 0.36, ground: '#30496b',
        },
        night: {
          top: '#040712', mid: '#0c132b', horizon: '#201842', bottom: '#050712',
          fog: '#121530', fogDensity: 0.0017,
          hemiSky: '#7c93d6', hemiGnd: '#1b1433', hemiInt: 0.55,
          sunColor: '#b7cfff', sunInt: 1.05, sunPos: [-120, 185, 110],
          rimInt: 0.72, exposure: 1.08, bloom: 0.68, ground: '#090e20',
        },
      };

      function applyTheme(name) {
        const th = THEMES[name];
        if (!th) return;
        skyDome.material.uniforms.uTopColor.value.set(th.top);
        skyDome.material.uniforms.uMidColor.value.set(th.mid);
        skyDome.material.uniforms.uHorizonColor.value.set(th.horizon);
        skyDome.material.uniforms.uBottomColor.value.set(th.bottom);
        scene.fog.color.set(th.fog);
        scene.fog.density = th.fogDensity;
        hemiLight.color.set(th.hemiSky);
        hemiLight.groundColor.set(th.hemiGnd);
        hemiLight.intensity = th.hemiInt;
        sunLight.color.set(th.sunColor);
        sunLight.intensity = th.sunInt;
        sunLight.position.set(...th.sunPos);
        rimLight.intensity = th.rimInt;
        renderer.toneMappingExposure = th.exposure;
        bloomPass.strength = th.bloom;
        groundPlane.material.color.set(th.ground);

        document.querySelectorAll('[data-theme]').forEach(b => {
          b.classList.toggle('active', b.dataset.theme === name);
        });
      }

      // 按钮事件绑定
      document.querySelectorAll('[data-cam]').forEach(btn => {
        btn.addEventListener('click', () => flyTo(btn.dataset.cam));
      });
      document.querySelectorAll('[data-theme]').forEach(btn => {
        btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
      });

      let magicAnimEnabled = true;
      const btnOrbit = document.getElementById('btn-orbit');
      btnOrbit.addEventListener('click', () => {
        controls.autoRotate = !controls.autoRotate;
        btnOrbit.classList.toggle('active', controls.autoRotate);
      });
      const btnAnim = document.getElementById('btn-anim');
      btnAnim.addEventListener('click', () => {
        magicAnimEnabled = !magicAnimEnabled;
        btnAnim.classList.toggle('active', magicAnimEnabled);
      });

      const hud = document.getElementById('hud');
      const hudToggleBtn = document.getElementById('hud-toggle-btn');
      document.getElementById('hud-header').addEventListener('click', () => {
        hud.classList.toggle('collapsed');
        hudToggleBtn.textContent = hud.classList.contains('collapsed') ? '展开' : '收起';
      });

      // 快捷键 1~6 快速切换视角
      const presetKeys = Object.keys(CAM_PRESETS);
      window.addEventListener('keydown', (e) => {
        const idx = parseInt(e.key, 10) - 1;
        if (idx >= 0 && idx < presetKeys.length) flyTo(presetKeys[idx]);
      });

      // 用户手动操作时取消镜头过渡动画
      controls.addEventListener('start', () => { camAnim = null; });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      // =======================================================================
      // 10. 渲染循环
      // =======================================================================
      const clock = new THREE.Clock();
      let elapsed = 0;

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        if (magicAnimEnabled) {
          elapsed += dt;
          // 1) 主塔三道巨型倾斜白石环缓慢交错自转
          for (const r of rotatingRings) {
            r.mesh.rotation.y += dt * r.speed;
          }
          // 2) 北方观星塔黄金星环缓慢旋转
          northRingRes.group.rotation.y -= dt * 0.24;

          // 3) 王冠内悬浮紫水晶优雅自转与呼吸悬浮
          crystalPivot.position.y = 157.5 + Math.sin(elapsed * 1.8) * 1.4;
          crystalRes.group.rotation.y += dt * 0.65;
          crystalLight.intensity = 62 + Math.sin(elapsed * 3.1) * 12;

          // 4) 紫色奥术能量光束脉冲与流动体素粒子
          beamOuterMat.opacity = 0.30 + Math.sin(elapsed * 4.0) * 0.08;
          for (const p of pulses) {
            const frac = (elapsed * p.speed + p.offset) % 1.0;
            p.mesh.position.lerpVectors(p.from, p.to, frac);
            p.mesh.rotation.x += dt * 3.2;
            p.mesh.rotation.y += dt * 2.5;
            const s = 0.7 + Math.sin(frac * Math.PI) * 0.65;
            p.mesh.scale.setScalar(s);
          }

          // 5) 空中星尘缓缓升腾旋转
          magicDust.rotation.y += dt * 0.025;
        }

        // 平滑镜头切换插值
        if (camAnim) {
          camAnim.t = Math.min(1, camAnim.t + dt * 1.35);
          const ease = 1 - Math.pow(1 - camAnim.t, 3);
          camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
          controls.target.lerpVectors(camAnim.startTgt, camAnim.endTgt, ease);
          if (camAnim.t >= 1) camAnim = null;
        }

        controls.update();
        composer.render();
      }

      animate();
    }

    init();
  </script>
</body>
</html>
