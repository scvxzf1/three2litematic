<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating_Arcane_Crystal_Island</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/src/web/assets/icon-32.png" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #090d16; font-family: system-ui, sans-serif; }
    #hud {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      background: rgba(9, 13, 22, 0.82); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px; color: #cbd5e1; padding: 7px 12px; font-size: 12px; pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">野生 Three.js 几何体场景（无 __VOXEL_DATA__，演示自动网格体素化）</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#090d16');

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(28, 22, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 4, 0);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;

    scene.add(new THREE.HemisphereLight(0xc7d2fe, 0x1e1b4b, 0.9));
    const dir = new THREE.DirectionalLight(0xffffff, 1.3);
    dir.position.set(25, 40, 20);
    scene.add(dir);

    // Inverted Cone Rocky Floating Island
    const rockCone = new THREE.Mesh(
      new THREE.ConeGeometry(11, 13, 7),
      new THREE.MeshStandardMaterial({ color: 0x484849, flatShading: true })
    );
    rockCone.rotation.x = Math.PI;
    rockCone.position.y = -3.5;
    scene.add(rockCone);

    // Lush Grassy Cap Cylinder
    const grassTop = new THREE.Mesh(
      new THREE.CylinderGeometry(11.4, 10.6, 2.2, 8),
      new THREE.MeshStandardMaterial({ color: 0x5ea918, flatShading: true })
    );
    grassTop.position.y = 3.2;
    scene.add(grassTop);

    // Stone Altar Ring Pillars
    const pillarGeo = new THREE.CylinderGeometry(0.9, 1.1, 7, 6);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xdfe0dc });
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2;
      const p = new THREE.Mesh(pillarGeo, pillarMat);
      p.position.set(Math.cos(angle) * 7.2, 7.5, Math.sin(angle) * 7.2);
      scene.add(p);
    }

    // Central Translucent Cyan Spire Crystal
    const mainCrystal = new THREE.Mesh(
      new THREE.OctahedronGeometry(3.6, 0),
      new THREE.MeshStandardMaterial({
        color: 0x4c7f99,
        transparent: true,
        opacity: 0.55,
        roughness: 0.1,
      })
    );
    mainCrystal.scale.set(1, 2.4, 1);
    mainCrystal.position.set(0, 12.5, 0);
    scene.add(mainCrystal);

    // Glowing Inner Core (Emissive -> Sea Lantern / Froglight!)
    const glowingCore = new THREE.Mesh(
      new THREE.OctahedronGeometry(1.6, 0),
      new THREE.MeshStandardMaterial({
        color: 0xacdbc2,
        emissive: 0x88ffee,
        emissiveIntensity: 1.0,
      })
    );
    glowingCore.scale.set(1, 1.8, 1);
    glowingCore.position.set(0, 12.5, 0);
    scene.add(glowingCore);

    // Tilted Floating Arcane Halo Ring (TorusGeometry -> Gold/Yellow Concrete)
    const halo = new THREE.Mesh(
      new THREE.TorusGeometry(6.8, 0.65, 8, 28),
      new THREE.MeshStandardMaterial({
        color: 0xfaf5ce,
        emissive: 0xffb733,
        emissiveIntensity: 0.85,
      })
    );
    halo.rotation.x = Math.PI * 0.38;
    halo.rotation.y = Math.PI * 0.15;
    halo.position.set(0, 12.5, 0);
    scene.add(halo);

    // Secondary Magenta Crystal Shards around base
    const shardGeo = new THREE.ConeGeometry(1.2, 4.8, 5);
    const shardMat = new THREE.MeshStandardMaterial({
      color: 0xb24cd8,
      transparent: true,
      opacity: 0.58,
    });
    for (const [sx, sz, rx, rz] of [[-4, 3, 0.25, 0.2], [4.2, -3.2, -0.2, -0.25], [-3.2, -4.4, -0.22, 0.22]]) {
      const shard = new THREE.Mesh(shardGeo, shardMat);
      shard.position.set(sx, 6.2, sz);
      shard.rotation.set(rx, 0, rz);
      scene.add(shard);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
